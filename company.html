<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法人向けサポート | Pidam Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; background: #0a0d1a; }

    .page-block {
      position: relative;
      width: 100%;
    }
    .page-block::before {
      content: '';
      display: block;
      padding-top: 56.25%;
    }
    .page-block img.bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }

    .image-link {
      position: absolute;
      z-index: 3;
      display: block;
    }
    .consultation-link {
      left: 27%;
      top: 87%;
      width: 46%;
      height: 10%;
      border-radius: 9999px;
    }
    .consultation-link:hover { background: rgba(255,255,255,0.12); }
    .email-consultation {
      display: block;
      padding: 0.7rem 1rem;
      background: #eef4fb;
      color: #0e55ad;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: clamp(0.78rem, 1.05vw, 1rem);
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }
    .email-consultation:hover { text-decoration: underline; }
    .intro-detail-link {
      left: 8.5%;
      top: 74%;
      width: 26%;
      height: 8%;
    }
    .intro-detail-link:hover { background: rgba(255,255,255,0.12); }
    .full-image-link { inset: 0; }

    .back-btn {
      position: fixed;
      top: 1.2rem;
      left: 1.2rem;
      z-index: 100;
      background: rgba(10,13,26,0.75);
      border: 1px solid rgba(201,168,76,0.35);
      color: #c9a84c;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      text-decoration: none;
      font-family: sans-serif;
      transition: background 0.3s;
    }
    .back-btn:hover { background: rgba(201,168,76,0.15); }
  </style>
</head>
<body>

  <a class="back-btn" href="support.html">← 戻る</a>

  <!-- 1枚目: company.jpg -->
  <div class="page-block">
    <img class="bg" src="images/company.jpg" alt="個別伴走サポート 導入 - Pidam Gallery">
    <a class="image-link intro-detail-link" href="#individual-support" aria-label="個別伴走サポートの詳しい内容はこちら"></a>
  </div>

  <!-- 2枚目: company2.jpg -->
  <div class="page-block">
    <img class="bg" src="images/company2.jpg" alt="法人向けサポート 2 - Pidam Gallery">
  </div>

  <!-- 3枚目: company3.jpg -->
  <div class="page-block" id="individual-support">
    <img class="bg" src="images/company3.jpg" alt="個別伴走サポート 詳細・料金・比較表 - Pidam Gallery">
    <a class="image-link consultation-link" href="#company-contact" aria-label="個別伴走サポートのお問い合わせはこちら"></a>
  </div>
  <a class="email-consultation" href="mailto:soyopin@kcn.jp">メールでのご相談はこちら</a>

  <!-- 4枚目: company4.jpg -->
  <div class="page-block" id="company-contact">
    <img class="bg" src="images/company4.jpg" alt="個別伴走サポート こんなお悩みありませんか - Pidam Gallery">
  </div>

  <!-- 5枚目: その他サポート -->
  <div class="page-block">
    <img class="bg" src="images/other_support.jpg" alt="その他サポート - Pidam Gallery">
    <a class="image-link full-image-link" href="other_support.html" aria-label="その他サポートのページを見る"></a>
  </div>

</body>
</html>
