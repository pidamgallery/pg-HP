<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Support | Pidam Gallery</title>


<style id="support-single-screen">
* { box-sizing: border-box; }
html { width: 100%; min-width: 0; margin: 0; padding: 0; scroll-behavior: auto; }
body {
 width: 100%; min-width: 0; margin: 0; padding: 0;
 min-height: 100vh; min-height: 100dvh; background: #0a0d1a;
 display: grid; justify-items: center; align-content: start;
}
/* Remove only the captured browser strip above the original artwork.
   Keep the title, crescent, three menus, QR, email and copyright intact. */
.page-wrapper {
 position: relative; width: min(100%, calc(100vh * 1920 / 1048));
 width: min(100%, calc(100dvh * 1920 / 1048));
 aspect-ratio: 1920 / 1048; margin: 0; padding: 0;
 overflow: hidden; overflow: clip; isolation: isolate;
}
.support-canvas {
 position: absolute; left: 0; top: calc(-100% * 32 / 1048);
 width: 100%; aspect-ratio: 1920 / 1080;
}
.bg { display: block; width: 100%; height: auto; margin: 0; }
.overlay { position: absolute; inset: 0; }
.image-link { position: absolute; display: block; border-radius: 999px; }
.image-link:hover { background: #ffffff0d; }
a:focus-visible { outline: 3px solid #ddc791; outline-offset: 3px; }
.service-link { left: 6.979167%; width: 36.666667%; height: 17.592593%; }
.course { top: 32.037037%; } .individual { top: 52.129630%; } .companion { top: 71.944444%; }
.btn-qr { position: absolute; display: block; left: 49.166667%; top: 79.259259%; width: 7.291667%; height: 12.962963%; border-radius: 6px; }
/* The new readable control covers the partial button captured in the image. */
.back-button {
 position: absolute; left: 0; top: calc(100% * 16 / 1048); z-index: 3;
 display: inline-flex; align-items: center; justify-content: center;
 width: max(148px, calc(100% * 100 / 1920));
 height: max(44px, calc(100% * 44 / 1048)); padding: 8px 16px;
 border: 1px solid #c9a84c77; border-radius: 999px;
 background: #0a0d1a; color: #ddc791; font: 14px/1.5 sans-serif;
 text-decoration: none; white-space: nowrap;
}
.back-button:hover { background: #18213a; }
@media (min-width: 768px) and (max-width: 1023px) {
 .back-button { width: max(132px, calc(100% * 100 / 1920)); height: max(28px, calc(100% * 44 / 1048)); padding: 2px 10px; font-size: 12px; }
}
@media (max-width: 767px) {
 .page-wrapper { width: 100%; }
 .back-button { top: 0; width: max(110px, calc(100% * 100 / 1920)); height: 18px; padding: 1px 8px; font-size: 10px; line-height: 1.4; }
}
@media (max-height: 560px) and (min-width: 768px) {
 .page-wrapper { width: 100%; }
}
</style>
</head><body><main class="page-wrapper" id="contact">
<a class="back-button" href="index.html" aria-label="トップページに戻る">← トップページに戻る</a>
<div class="support-canvas">
<img class="bg" src="images/support.jpg" alt="AI Support — AI初心者講座、はじめてのAIサポート、個別伴走サポート。LINEのQRコードと連絡先メール soyopin@kcn.jp。">
<nav class="overlay" aria-label="AIサポートメニュー">

<a class="image-link service-link course" href="beginner.html" aria-label="AI初心者講座"></a>
<a class="image-link service-link individual" href="beginner-support.html" aria-label="はじめてのAIサポート"></a>
<a class="image-link service-link companion" href="company.html" aria-label="個別伴走サポート"></a>
<!-- Existing QR link is preserved until its destination is confirmed. -->
<a class="btn-qr" href="" target="_blank" aria-label="LINE相談はこちら"></a>
</nav></div>
</main>
</body></html>
