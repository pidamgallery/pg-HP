<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音楽・動画制作 | Pidam Gallery</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-width: 0; background: #192148; }
.screen { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
.page-wrapper { position: relative; width: min(100%, calc(100vh * var(--ratio))); width: min(100%, calc(100dvh * var(--ratio))); }
.bg { display: block; width: 100%; height: auto; }
.back-btn {
 position: absolute; left: 40px; bottom: 8px; z-index: 5;
 display: inline-flex; align-items: center; justify-content: center;
 min-height: 44px; max-width: calc(100% - 48px); padding: 10px 16px;
 border: 1px solid #c9a84c66; border-radius: 999px; background: #0a0d1ae6;
 color: #ddc791; font: 14px/1.5 sans-serif; text-decoration: none;
}
.back-btn:hover { background: #26315b; }
a:focus-visible { outline: 3px solid #ddc791; outline-offset: 3px; }
.music-artwork { position: relative; }
.video-trigger, .video-frame {
 position: absolute; left: 50%; top: 11%; width: 40.52%; height: 47%;
}
.video-trigger { display: grid; place-items: center; text-decoration: none; }
.video-trigger svg { width: clamp(42px, 6vw, 72px); height: auto; filter: drop-shadow(0 2px 7px #0008); }
.video-trigger:hover svg { filter: brightness(1.15) drop-shadow(0 2px 7px #0008); }
.video-frame { display: block; border: 0; background: #0a0d1a; }
.video-direct {
 position: absolute; top: 58.5%; right: 9.48%; padding: 4px 0;
 color: #ddc791; font: 12px/1.3 system-ui, sans-serif;
}
[hidden] { display: none !important; }
@media (max-width: 767px) {
 .screen.music-screen.video-active { display: block; height: auto; min-height: 0; scroll-snap-align: none; }
 .screen.music-screen.video-active > .page-wrapper { width: 100%; height: auto; aspect-ratio: auto; }
 .video-frame { position: static; width: calc(100% - 24px); height: auto; aspect-ratio: 16 / 9; margin: 0 auto; }
 .video-direct { position: static; display: block; width: fit-content; margin: 0 auto; padding: 12px; }
}
@media (max-width: 767px) {
 .screen { min-height: 0; display: block; }
 .page-wrapper { width: 100%; }
 .back-btn { min-height: 22px; padding: 2px 8px; font-size: 10px; }
}
</style>

<style id="mobile-complete-screen">
/* Phone-only: preserve artwork proportions and keep browser controls in view. */
@media (max-width: 767px), (max-width: 1100px) and (pointer: coarse) {
html {scroll-snap-type:y proximity; scroll-padding:0;} html,body {height:auto; min-height:100svh; overflow:visible;}
body {display:block;}
.layout-navigation .back-btn, .layout-navigation .nav-button, .back-btn, .back-button {min-height:24px; height:auto; padding:3px 8px; font-size:10px; line-height:1.4;}
.page-wrapper > .layout-navigation, .sample-art > .layout-navigation {position:absolute; top:4px; left:4px; right:auto; max-width:calc(100% - 8px); padding:0; gap:8px;}
.back-button {top:0;}
.screen {display:grid; place-items:center; height:100svh; min-height:0; scroll-snap-align:start;}
.screen > .page-wrapper { position:relative; width:min(100%, calc((100svh - 0px) * var(--ratio))); height:auto; min-height:0; max-width:100%; max-height:none; aspect-ratio:var(--ratio); margin:0 auto; padding:0; }
.screen > .page-wrapper > img { display:block; position:static; width:100%; height:auto; max-width:100%; max-height:none; object-fit:contain; }
}
</style>
<style id="mobile-portrait-natural-flow">
/* Portrait phones follow the image heights with no filler between sheets. */
@media (max-width: 767px) and (orientation: portrait),
       (max-width: 1100px) and (pointer: coarse) and (orientation: portrait) {
 html { scroll-snap-type: none; }
 .screen { display: block; height: auto; min-height: 0; scroll-snap-align: none; }
 .screen > .page-wrapper { width: 100%; height: auto; min-height: 0; margin: 0; }
}
</style>
</head>
<body>
<section class="screen music-screen" aria-label="音楽・動画制作">
 <main class="page-wrapper" style="--ratio:1.92">
  <div class="music-artwork">
   <img class="bg" src="images/music.jpg" width="1920" height="1000"
    alt="音楽・動画制作。Sunoで制作したオリジナル楽曲「一歩ずつ光へ」。人と比べて焦ったり、立ち止まったり。思うように進めない日もある。それでも、自分の歩幅でいい。不安を抱えたままでも、一歩ずつ前へ。">
   <a class="video-trigger" href="https://youtu.be/5c9rvlljQXw" target="_blank" rel="noopener noreferrer"
    aria-label="一歩ずつ光へを再生">
    <svg viewBox="0 0 68 48" aria-hidden="true" focusable="false">
     <rect width="68" height="48" rx="12" fill="#c90000"/>
     <path d="m28 14 18 10-18 10z" fill="#fff"/>
    </svg>
   </a>
  </div>
  <iframe class="video-frame" hidden data-src="https://www.youtube.com/embed/5c9rvlljQXw?autoplay=1&amp;playsinline=1"
   title="一歩ずつ光へ ミュージックビデオ" referrerpolicy="strict-origin-when-cross-origin"
   allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
  <a class="video-direct" href="https://youtu.be/5c9rvlljQXw" target="_blank" rel="noopener noreferrer" hidden>YouTubeで見る（別タブ）</a>
 </main>
</section>
<section class="screen" aria-label="制作のご相談">
 <div class="page-wrapper consultation-art" style="--ratio:1.7777777777777777">
  <img class="bg" src="images/制作のご相談.jpg" width="1920" height="1080" alt="制作のご相談。画像生成・名刺制作のサポート。ご相談はメールにて承ります。">
  <a class="back-btn" href="activity.html">活動実績一覧に戻る</a>
 </div>
</section>
<script>
const musicScreen = document.querySelector('.music-screen');
const videoTrigger = musicScreen.querySelector('.video-trigger');
const videoFrame = musicScreen.querySelector('.video-frame');
const videoDirect = musicScreen.querySelector('.video-direct');

videoTrigger.addEventListener('click', (event) => {
 if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
 event.preventDefault();
 musicScreen.classList.add('video-active');
 videoFrame.src = videoFrame.dataset.src;
 videoFrame.hidden = false;
 videoTrigger.hidden = true;
 videoDirect.hidden = false;
 videoFrame.focus();
 if (window.matchMedia('(max-width: 767px)').matches) videoFrame.scrollIntoView({ block: 'nearest' });
});
</script>
</body>
</html>
