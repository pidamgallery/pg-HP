<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音楽・動画制作 | Pidam Gallery</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-width: 0; background: #192148; }
.screen { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
.page-wrapper { position: relative; width: min(100%, calc(100vh * var(--ratio))); width: min(100%, calc(100dvh * var(--ratio))); }
.bg { display: block; width: 100%; height: auto; }
.back-btn {
 position: absolute; left: 40px; bottom: 8px; z-index: 5;
 display: inline-flex; align-items: center; justify-content: center;
 min-height: 44px; max-width: calc(100% - 48px); padding: 10px 16px;
 border: 1px solid #c9a84c66; border-radius: 999px; background: #0a0d1ae6;
 color: #ddc791; font: 14px/1.5 sans-serif; text-decoration: none;
}
.back-btn:hover { background: #26315b; }
a:focus-visible { outline: 3px solid #ddc791; outline-offset: 3px; }
.video-slot { position: absolute; left: 65.573%; top: 15%; width: 27.396%; height: 71.6%; }
.video-slot video { width: 100%; height: 100%; object-fit: contain; background: #192148; }
[hidden] { display: none !important; }
@media (max-width: 767px) {
 .screen { min-height: 0; display: block; }
 .page-wrapper { width: 100%; }
 .back-btn { min-height: 22px; padding: 2px 8px; font-size: 10px; }
}
</style>

<style id="mobile-complete-screen">
/* Phone-only: preserve artwork proportions and keep browser controls in view. */
@media (max-width: 767px), (max-width: 1100px) and (pointer: coarse) {
html {scroll-snap-type:y proximity; scroll-padding:0;} html,body {height:auto; min-height:100svh; overflow:visible;}
body {display:block;}
.layout-navigation .back-btn, .layout-navigation .nav-button, .back-btn, .back-button {min-height:24px; height:auto; padding:3px 8px; font-size:10px; line-height:1.4;}
.page-wrapper > .layout-navigation, .sample-art > .layout-navigation {position:absolute; top:4px; left:4px; right:auto; max-width:calc(100% - 8px); padding:0; gap:8px;}
.back-button {top:0;}
.screen {display:grid; place-items:center; height:100svh; min-height:0; scroll-snap-align:start;}
.screen > .page-wrapper { position:relative; width:min(100%, calc((100svh - 0px) * var(--ratio))); height:auto; min-height:0; max-width:100%; max-height:none; aspect-ratio:var(--ratio); margin:0 auto; padding:0; }
.screen > .page-wrapper > img { display:block; position:static; width:100%; height:auto; max-width:100%; max-height:none; object-fit:contain; }
}
</style>
<style id="mobile-portrait-natural-flow">
/* Portrait phones follow the image heights with no filler between sheets. */
@media (max-width: 767px) and (orientation: portrait),
       (max-width: 1100px) and (pointer: coarse) and (orientation: portrait) {
 html { scroll-snap-type: none; }
 .screen { display: block; height: auto; min-height: 0; scroll-snap-align: none; }
 .screen > .page-wrapper { width: 100%; height: auto; min-height: 0; margin: 0; }
}
</style>
</head>
<body>
<section class="screen" aria-label="音楽・動画制作">
 <main class="page-wrapper" style="--ratio:1.92">
  <!-- The supplied image is 1920 x 1000; preserve its natural ratio without cropping. -->
  <img class="bg" src="images/music_準備中.jpg" width="1920" height="1000" alt="音楽・動画制作。SUNOで制作したオリジナル楽曲「一歩ずつ光へ」とAI画像を使った動画をご紹介。動画は準備中。">
  <!-- Future video: unhide this slot and set the video src to the completed file. -->
  <div class="video-slot" hidden><video controls playsinline preload="none" aria-label="一歩ずつ光へ"></video></div>
 </main>
</section>
<section class="screen" aria-label="制作のご相談">
 <div class="page-wrapper consultation-art" style="--ratio:1.7777777777777777">
  <img class="bg" src="images/制作のご相談.jpg" width="1920" height="1080" alt="制作のご相談。画像生成・名刺制作のサポート。ご相談はメールにて承ります。">
  <a class="back-btn" href="activity.html">活動実績一覧に戻る</a>
 </div>
</section>
</body>
</html>
