<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>はじめてのAIサポート | Pidam Gallery</title>
<style>
*{box-sizing:border-box}
html,body,main{margin:0;padding:0;width:100%;min-width:0}
.support-sheet{position:relative;width:100%;margin:0;padding:0}
.support-sheet img{display:block;width:100%;height:auto;margin:0}
.back-btn{position:absolute;top:8px;left:40px;z-index:1;display:inline-flex;align-items:center;justify-content:center;min-height:44px;max-width:calc(100% - 52px);padding:10px 16px;border:1px solid #c9a84c77;border-radius:999px;background:#0a0d1a;color:#ddc791;font:14px/1.5 sans-serif;text-decoration:none;text-align:center}
.back-btn:focus-visible{outline:3px solid #80631f;outline-offset:2px}
/* Keep all bottom icons. On landscape PCs, only spare upper background is trimmed. */
@media(min-width:1100px) and (min-aspect-ratio:16/9) and (max-aspect-ratio:21/10){
.support-sheet{height:100dvh;overflow:hidden}
.support-sheet img{height:100%;object-fit:cover;object-position:center bottom}
}
@media(max-width:600px){.back-btn{top:4px;left:12px;max-width:calc(100% - 24px);min-height:28px;padding:4px 10px;font-size:12px;line-height:18px}}
</style>
<style id="mobile-complete-screen">
/* Phone-only: preserve artwork proportions and keep browser controls in view. */
@media (max-width: 767px), (max-width: 1100px) and (pointer: coarse) {
html {scroll-snap-type:y proximity; scroll-padding:0;} html,body {height:auto; min-height:100svh; overflow:visible;}
body {display:block;}
.layout-navigation .back-btn, .layout-navigation .nav-button, .back-btn, .back-button {min-height:24px; height:auto; padding:3px 8px; font-size:10px; line-height:1.4;}
.page-wrapper > .layout-navigation, .sample-art > .layout-navigation {position:absolute; top:4px; left:4px; right:auto; max-width:calc(100% - 8px); padding:0; gap:8px;}
.back-button {top:0;}
.support-sheet {width:100%; height:100svh; min-height:0; overflow:visible; display:grid; place-items:center;}
.support-sheet img {width:auto; height:auto; max-width:100%; max-height:100svh; object-fit:contain;}
}
</style>
</head><body><main aria-label="はじめてのAIサポート"><section class="support-sheet"><img src="images/beginner-support-v2.png" alt="はじめてのAIサポート・個別サポートのご案内"><a class="back-btn" href="support.html">← AI Supportへ戻る</a></section></main></body></html>
