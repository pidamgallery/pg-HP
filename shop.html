<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | Pidam Gallery</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 0; margin: 0; padding: 0; background: #0a0d1a; }
    .shop-sheet { position: relative; width: 100%; margin: 0; }
    .shop-sheet img { display: block; width: 100%; height: auto; }
    .layout-navigation {
      position: absolute; top: 8px; left: 40px; z-index: 2;
      display: flex; flex-wrap: nowrap; align-items: center; gap: 12px;
      max-width: calc(100% - 48px);
    }
    .back-btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 10px 16px;
      border: 1px solid #c9a84c77; border-radius: 999px;
      background: #0a0d1a; color: #ddc791;
      font: 14px/1.5 sans-serif; text-decoration: none; white-space: nowrap;
    }
    .back-btn:hover { background: #c9a84c15; }
    .shop-link { position: absolute; display: block; border-radius: 999px; }
    .shop-link:hover { background: rgba(255,255,255,.1); }
    /* Coordinates follow the original 1920 x 1000 image at every display size. */
    .btn-booth { left: 12.5%; top: 42.2%; width: 17.916667%; height: 6.5%; }
    .btn-mercari { left: 12.5%; top: 72.4%; width: 17.916667%; height: 6.3%; }
    a:focus-visible { outline: 3px solid #ddc791; outline-offset: 2px; }
    @media (max-width: 600px) {
      .layout-navigation { gap: 8px; }
      .back-btn { min-height: 0; padding: 2px 8px; font-size: 10px; line-height: 1.4; }
    }
  </style>

<style id="mobile-complete-screen">
/* Phone-only: preserve artwork proportions and keep browser controls in view. */
@media (max-width: 767px), (max-width: 1100px) and (pointer: coarse) {
html {scroll-snap-type:y proximity; scroll-padding:0;} html,body {height:auto; min-height:100svh; overflow:visible;}
body {display:block;}
.layout-navigation .back-btn, .layout-navigation .nav-button, .back-btn, .back-button {min-height:24px; height:auto; padding:3px 8px; font-size:10px; line-height:1.4;}
.page-wrapper > .layout-navigation, .sample-art > .layout-navigation {position:absolute; top:4px; left:4px; right:auto; max-width:calc(100% - 8px); padding:0; gap:8px;}
.back-button {top:0;}
.shop-sheet { position:relative; width:min(100%, calc((100svh - 0px) * 1.92)); height:auto; min-height:0; max-width:100%; max-height:none; aspect-ratio:1.92; margin:0 auto; padding:0; }
.shop-sheet > img { display:block; position:static; width:100%; height:auto; max-width:100%; max-height:none; object-fit:contain; }
}
</style>
</head>
<body>
  <main class="shop-sheet" aria-label="作品販売 Shop">
    <img src="images/shop.jpg" width="1920" height="1000" alt="Shop。BOOTHでは幻想アート・神獣作品・音楽のデータ販売。メルカリでは現物作品の販売・新作掲載。">
    <nav class="layout-navigation" aria-label="ページ移動">
      <a class="back-btn" href="index.html">← トップページに戻る</a>
      <a class="back-btn" href="activity.html">← 活動内容一覧に戻る</a>
    </nav>
    <a class="shop-link btn-booth" href="https://pidam-gallery.booth.pm/" target="_blank" rel="noopener noreferrer" aria-label="BOOTHを見る（新しいタブで開く）"></a>
    <a class="shop-link btn-mercari" href="https://jp.mercari.com/user/profile/968855455" target="_blank" rel="noopener noreferrer" aria-label="メルカリを見る（新しいタブで開く）"></a>
  </main>
</body>
</html>
